name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all tests (incl. tracking contract, docs/TRACKING.md)
        run: |
          set -e
          for t in tests/*.mjs; do echo "== $t"; node "$t"; done
