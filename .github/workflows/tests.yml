name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Brand lint and tests
        run: |
          set -e
          echo "== tests/brand-guard.mjs"
          node tests/brand-guard.mjs
          for t in tests/*.mjs; do
            if [ "$t" = "tests/brand-guard.mjs" ]; then continue; fi
            echo "== $t"
            node "$t"
          done
